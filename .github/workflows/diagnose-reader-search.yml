name: Diagnose Reader Search

on:
  push:
    branches: [agent/disposition-batch-1]
    paths:
      - '.github/workflows/diagnose-reader-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/disposition-batch-1
      - name: Print reader search implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          needles = ['manualSearchMeta', 'manualSearch', 'manualClearSearch', 'manual-page-card']
          for needle in needles:
              print(f'=== {needle} occurrences ===')
              start = 0
              while True:
                  i = s.find(needle, start)
                  if i < 0: break
                  lo=max(0,i-1200); hi=min(len(s),i+2200)
                  print(s[lo:hi])
                  print('\n---\n')
                  start=i+len(needle)
          PY
