name: Manual Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: agent/disposition-batch-3
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply SHA-bound Batch 3 metadata repair when staged
        run: |
          if [[ -f tools/fix_batch3_r01_metadata.py ]]; then
            python tools/fix_batch3_r01_metadata.py
          fi

      - name: Full non-browser Batch 3 verification
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
          python tools/validate_manual.py --input index.html --json manual-validation.json --markdown manual-validation.md --strict-warnings
          python tools/reconcile_entry_lineage.py --input index.html --json entry-lineage.json --markdown entry-lineage.md --expect-pending 14 --expect-drafted 77 --expect-total 91 --expect-pages 315 --enforce
          python tools/classify_editorial_occurrences.py
          git diff --exit-code -- docs/EDITORIAL_OCCURRENCE_CLASSIFIER_2026-08-12.csv
          python tools/audit_editorial_lineage.py --input index.html --repository-root . --json editorial-lineage.json --markdown editorial-lineage.md
          git diff --check

      - name: Commit repaired reader only when needed
        run: |
          if [[ -f tools/fix_batch3_r01_metadata.py ]]; then
            git rm -f tools/fix_batch3_r01_metadata.py
            git add index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git diff --cached --check
            git commit -m 'repair Batch 3 R-01 metadata parity'
            git push origin HEAD:agent/disposition-batch-3
          fi
