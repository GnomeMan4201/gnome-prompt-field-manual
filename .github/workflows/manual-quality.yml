name: Manual Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Syntax check
        run: python -m compileall -q tools/validate_manual.py tests/test_validate_manual.py

      - name: Validator unit tests
        run: python -m unittest discover -s tests -p 'test_validate_manual.py' -v

      - name: Validate committed manual
        run: |
          python tools/validate_manual.py \
            --input index.html \
            --json manual-validation.json \
            --markdown manual-validation.md

      - name: Verify evidence outputs
        run: test -s manual-validation.json && test -s manual-validation.md

      - name: Publish validation summary
        if: always()
        run: |
          if [[ -f manual-validation.md ]]; then
            cat manual-validation.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-validation-${{ github.sha }}
          path: |
            manual-validation.json
            manual-validation.md
          if-no-files-found: warn
          retention-days: 30
