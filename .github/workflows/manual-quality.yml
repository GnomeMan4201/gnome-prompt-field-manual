name: Manual Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out bounded closeout branch
        uses: actions/checkout@v6
        with:
          ref: closeout/auditable-v1-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Syntax check
        run: |
          python -m compileall -q \
            tools/inspect_manual.py \
            tools/patch_manual_semantics.py \
            tools/validate_manual.py \
            tests/test_validate_manual.py

      - name: Print exact semantic repair targets
        run: |
          python - <<'PY'
          from pathlib import Path
          tokens = ("hdr-title", "section-title", 'class="wrap"', "class='wrap'")
          for number, line in enumerate(Path("index.html").read_text(encoding="utf-8").splitlines(), 1):
              if any(token in line for token in tokens):
                  print(f"{number}: {line[:800]!r}")
          PY

      - name: Apply exact hash-gated semantic repair
        run: python tools/patch_manual_semantics.py index.html

      - name: Validator unit tests
        run: python -m unittest discover -s tests -p 'test_validate_manual.py' -v

      - name: Print bounded DOM inventory
        run: python tools/inspect_manual.py index.html --max-elements 80

      - name: Validate repaired manual
        run: |
          python tools/validate_manual.py \
            --input index.html \
            --json manual-validation.json \
            --markdown manual-validation.md \
            --strict-warnings

      - name: Bound generated source changes
        id: diff
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "index.html" ]]; then
            printf 'unexpected generated paths:\n%s\n' "${changed[@]}" >&2
            exit 1
          fi
          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit repaired index to the PR branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git diff --cached --check
          git commit -m 'fix: add semantic landmarks to PTSP workspace'
          git push origin HEAD:closeout/auditable-v1-baseline

      - name: Verify evidence outputs
        run: test -s manual-validation.json && test -s manual-validation.md

      - name: Publish validation summary
        if: always()
        run: |
          if [[ -f manual-validation.md ]]; then
            cat manual-validation.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-validation-${{ github.sha }}
          path: |
            manual-validation.json
            manual-validation.md
          if-no-files-found: warn
          retention-days: 30
