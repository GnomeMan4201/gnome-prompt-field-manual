name: Reader Browser Smoke

on:
  pull_request:
    paths:
      - index.html
      - tests/browser_smoke.mjs
      - package.json
      - package-lock.json
      - .github/workflows/reader-browser-smoke.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/browser_smoke.mjs
      - package.json
      - package-lock.json
      - .github/workflows/reader-browser-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.browser }} reader smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/browser_smoke.mjs ${{ matrix.browser }}
