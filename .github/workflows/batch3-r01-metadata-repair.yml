name: Batch 3 R-01 Metadata Repair

on:
  push:
    branches: [agent/disposition-batch-3]
    paths:
      - 'tools/fix_batch3_r01_metadata.py'
      - '.github/workflows/batch3-r01-metadata-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/disposition-batch-3
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Repair SHA-bound R-01 metadata
        run: python tools/fix_batch3_r01_metadata.py
      - name: Verify current Batch 3 state
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_manual.py --input index.html --json manual-validation.json --markdown manual-validation.md --strict-warnings
          python tools/reconcile_entry_lineage.py --input index.html --json entry-lineage.json --markdown entry-lineage.md --expect-pending 14 --expect-drafted 77 --expect-total 91 --expect-pages 315 --enforce
          python tools/classify_editorial_occurrences.py
          git diff --exit-code -- docs/EDITORIAL_OCCURRENCE_CLASSIFIER_2026-08-12.csv
          python tools/audit_editorial_lineage.py --input index.html --repository-root . --json editorial-lineage.json --markdown editorial-lineage.md
          git diff --check
      - name: Remove temporary repair script
        run: git rm -f tools/fix_batch3_r01_metadata.py
      - name: Commit repaired reader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git add -u tools/fix_batch3_r01_metadata.py
          git diff --cached --check
          git commit -m 'repair Batch 3 R-01 metadata parity'
          git push origin HEAD:agent/disposition-batch-3
