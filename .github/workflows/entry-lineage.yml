name: Entry Lineage

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tools/reconcile_entry_lineage.py'
      - 'tests/test_reconcile_entry_lineage.py'
      - '.github/workflows/entry-lineage.yml'
      - 'docs/IDENTITY_AND_SCOPE.md'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/reconcile_entry_lineage.py'
      - 'tests/test_reconcile_entry_lineage.py'
      - '.github/workflows/entry-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entry-lineage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Syntax check
        run: python -m compileall -q tools/reconcile_entry_lineage.py tests/test_reconcile_entry_lineage.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_reconcile_entry_lineage.py' -v

      - name: Generate source-grounded lineage evidence
        run: |
          python tools/reconcile_entry_lineage.py \
            --input index.html \
            --json entry-lineage.json \
            --markdown entry-lineage.md \
            --expect-pending 22 \
            --expect-total 92 \
            --expect-pages 315

      - name: Verify evidence outputs
        run: test -s entry-lineage.json && test -s entry-lineage.md

      - name: Publish lineage summary
        run: cat entry-lineage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lineage evidence
        uses: actions/upload-artifact@v7
        with:
          name: entry-lineage-${{ github.sha }}
          path: |
            entry-lineage.json
            entry-lineage.md
          if-no-files-found: error
          retention-days: 30
