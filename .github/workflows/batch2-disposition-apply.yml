name: Batch 2 Disposition Apply

on:
  push:
    branches: [agent/disposition-batch-2]
    paths:
      - 'tools/apply_batch2_disposition.py'
      - '.github/workflows/batch2-disposition-apply.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_batch2_disposition.py'
      - '.github/workflows/batch2-disposition-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch2-disposition-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/disposition-batch-2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply hash-gated Batch 2 disposition
        run: python tools/apply_batch2_disposition.py
      - name: Run complete non-browser verification gate
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
          python tools/validate_manual.py --input index.html --json manual-validation.json --markdown manual-validation.md --strict-warnings
          python tools/reconcile_entry_lineage.py --input index.html --json entry-lineage.json --markdown entry-lineage.md --expect-pending 16 --expect-drafted 75 --expect-total 91 --expect-pages 315 --enforce
          python tools/classify_editorial_occurrences.py
          git diff --exit-code -- docs/EDITORIAL_OCCURRENCE_CLASSIFIER_2026-08-12.csv
          python tools/audit_editorial_lineage.py --input index.html --repository-root . --json editorial-lineage.json --markdown editorial-lineage.md
          git diff --check
          grep -q "run W-11 (The Anti-Summary) first to determine whether rewriting is appropriate" index.html
          grep -q "SPECIFIC OBJECTIONS A numbered list of at least three distinct objections" index.html
          grep -q "document.getElementById('b-r01').classList.add('open');" index.html
          grep -q "document.getElementById('b-r03').classList.add('open');" index.html
          ! grep -q "id=\"b-w01\"" index.html
          ! grep -q "id=\"b-w02\"" index.html
          ! grep -q "id=\"b-w03\"" index.html
      - name: Prepare content-only commit
        run: git rm -f tools/apply_batch2_disposition.py
      - name: Commit Batch 2 disposition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then echo 'workflow file unexpectedly staged' >&2; exit 1; fi
          git diff --cached --check
          git commit -m 'adjudicate Batch 2 W-01 W-02 W-03'
          git push origin HEAD:agent/disposition-batch-2
