name: Batch 3 Context Extract

on:
  push:
    branches: [agent/disposition-batch-3]
    paths:
      - 'tools/extract_batch3_context.py'
      - '.github/workflows/batch3-context-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/disposition-batch-3
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python tools/extract_batch3_context.py
      - name: Commit extraction only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add batch3-extraction.txt
          git commit -m 'extract Batch 3 adjudication context'
          git push origin HEAD:agent/disposition-batch-3
