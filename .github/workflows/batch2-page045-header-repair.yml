name: Batch 2 Page 045 Header Repair

on:
  push:
    branches: [agent/disposition-batch-2]
    paths:
      - 'tools/repair_batch2_page045_header.py'
      - '.github/workflows/batch2-page045-header-repair.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/repair_batch2_page045_header.py'
      - '.github/workflows/batch2-page045-header-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/disposition-batch-2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Repair page 045 header
        run: python tools/repair_batch2_page045_header.py
      - name: Verify repaired state
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_manual.py --input index.html --json manual-validation.json --markdown manual-validation.md --strict-warnings
          python tools/reconcile_entry_lineage.py --input index.html --json entry-lineage.json --markdown entry-lineage.md --expect-pending 16 --expect-drafted 75 --expect-total 91 --expect-pages 315 --enforce
          python tools/classify_editorial_occurrences.py
          git diff --exit-code -- docs/EDITORIAL_OCCURRENCE_CLASSIFIER_2026-08-12.csv
          python tools/audit_editorial_lineage.py --input index.html --repository-root . --json editorial-lineage.json --markdown editorial-lineage.md
          git diff --check
      - name: Prepare content-only commit
        run: git rm -f tools/repair_batch2_page045_header.py
      - name: Commit repaired header
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then echo 'workflow file unexpectedly staged' >&2; exit 1; fi
          git diff --cached --check
          git commit -m 'repair Batch 2 page 045 header parity'
          git push origin HEAD:agent/disposition-batch-2
