name: Reactor Integrity

on:
  pull_request:
    paths:
      - '.github/workflows/reactor-integrity.yml'
      - 'workbench/reactor/**'
      - 'workbench/data/entry_identity_index.json'
      - 'schemas/reactor-*.schema.json'
      - 'tools/reactor_*.py'
      - 'tools/verify_reactor_capsule.py'
      - 'tests/test_reactor_*.py'
      - 'tests/reactor_fixtures.py'
      - 'qa/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reactor-integrity.yml'
      - 'workbench/reactor/**'
      - 'workbench/data/entry_identity_index.json'
      - 'schemas/reactor-*.schema.json'
      - 'tools/reactor_*.py'
      - 'tools/verify_reactor_capsule.py'
      - 'tests/test_reactor_*.py'
      - 'tests/reactor_fixtures.py'
      - 'qa/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reactor-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reactor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install formal schema validator
        run: python -m pip install 'jsonschema==4.23.0'

      - name: Verify current editorial identity and frozen research provenance
        run: |
          python - <<'PYVERIFY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from export_entry_identity_index import build_inventory

          current_path = Path("index.html")
          current = json.loads(Path("workbench/data/current_entry_identity_index.json").read_text())
          actual = hashlib.sha256(current_path.read_bytes()).hexdigest()
          assert actual == current["sourceIndexSha256"], "current identity source mismatch"
          assert actual == "8c7a56dc0687809e691ee09030f2a028c290c3ab81a64e63f4b58b6d809df3bd"
          assert current == build_inventory(current_path), "current identity inventory not reproducible"
          assert current["counts"] == {"pending": 11, "drafted": 80, "total": 91, "pages": 315}
          assert current["bodyCoverage"] == 0

          frozen = Path("tests/fixtures/batch3-canonical-1f06445e.html").read_bytes()
          historical = json.loads(Path("workbench/data/entry_identity_index.json").read_text())
          old_sha = hashlib.sha256(frozen).hexdigest()
          assert old_sha == historical["sourceIndexSha256"]
          assert old_sha == "1f06445eb18295fce20ef0bf350d0237ead9d8713005ea2177e1281854210c19"
          assert historical["counts"] == {"pending": 14, "drafted": 77, "total": 91, "pages": 315}
          assert historical["bodyCoverage"] == 0
          print("Current 11/80 identity reproducible; historical 14/77 SHA-256 preserved; 0 verified bodies.")
          PYVERIFY

      - name: Python and JavaScript syntax
        run: |
          python -m compileall -q tools/reactor_engine.py tools/reactor_evidence_v2.py tools/reactor_pair_runner.py tools/reactor_chamber.py tools/reactor_evaluator.py tools/reactor_local_runner.py tools/verify_reactor_capsule.py tests
          for file in workbench/reactor/*.js; do node --check "$file"; done

      - name: Run all repository tests with no skipped cases
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"Run={result.testsRun}, skipped={len(result.skipped)}, failures={len(result.failures)}, errors={len(result.errors)}")
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY

      - name: Editorial source regression gates
        run: |
          python tools/validate_manual.py --input index.html --strict-warnings
          python tools/reconcile_entry_lineage.py --input index.html --expect-pending 11 --expect-drafted 80 --expect-total 91 --expect-pages 315 --enforce
          python tools/audit_editorial_lineage.py --input index.html
