name: Reactor Integrity

on:
  pull_request:
    paths:
      - '.github/workflows/reactor-integrity.yml'
      - 'workbench/reactor/**'
      - 'workbench/data/entry_identity_index.json'
      - 'schemas/reactor-*.schema.json'
      - 'tools/reactor_*.py'
      - 'tools/verify_reactor_capsule.py'
      - 'tests/test_reactor_*.py'
      - 'tests/reactor_fixtures.py'
      - 'qa/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reactor-integrity.yml'
      - 'workbench/reactor/**'
      - 'workbench/data/entry_identity_index.json'
      - 'schemas/reactor-*.schema.json'
      - 'tools/reactor_*.py'
      - 'tools/verify_reactor_capsule.py'
      - 'tests/test_reactor_*.py'
      - 'tests/reactor_fixtures.py'
      - 'qa/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reactor-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reactor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install formal schema validator
        run: python -m pip install 'jsonschema==4.23.0'

      - name: Fail if source identity inventory is inconsistent
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          source = Path("index.html").read_bytes()
          data = json.loads(Path("workbench/data/entry_identity_index.json").read_text())
          actual = hashlib.sha256(source).hexdigest()
          assert actual == data["sourceIndexSha256"], "canonical source hash mismatch"
          assert actual == "1f06445eb18295fce20ef0bf350d0237ead9d8713005ea2177e1281854210c19"
          assert len(data["entries"]) == data["counts"]["total"] == 91
          assert data["bodyCoverage"] == 0
          print("Source index anchored to canonical HTML; 91 candidates; 0 verified.")
          PY

      - name: Python and JavaScript syntax
        run: |
          python -m compileall -q tools/reactor_engine.py tools/reactor_evidence_v2.py tools/reactor_pair_runner.py tools/reactor_chamber.py tools/reactor_evaluator.py tools/reactor_local_runner.py tools/verify_reactor_capsule.py tests
          for file in workbench/reactor/*.js; do node --check "$file"; done

      - name: Run all repository tests with no skipped cases
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"Run={result.testsRun}, skipped={len(result.skipped)}, failures={len(result.failures)}, errors={len(result.errors)}")
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY

      - name: Editorial source regression gates
        run: |
          python tools/validate_manual.py --input index.html --strict-warnings
          python tools/reconcile_entry_lineage.py --input index.html --expect-pending 14 --expect-drafted 77 --expect-total 91 --expect-pages 315 --enforce
          python tools/audit_editorial_lineage.py --input index.html
