name: Batch 3 Disposition Apply

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_batch3_disposition.py'
      - '.github/workflows/batch3-disposition-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch3-disposition-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/disposition-batch-3
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply hash-gated Batch 3 disposition
        run: python tools/apply_batch3_disposition.py
      - name: Verify Batch 3 non-browser gate
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
          python tools/validate_manual.py --input index.html --json manual-validation.json --markdown manual-validation.md --strict-warnings
          python tools/reconcile_entry_lineage.py --input index.html --json entry-lineage.json --markdown entry-lineage.md --expect-pending 14 --expect-drafted 77 --expect-total 91 --expect-pages 315 --enforce
          python tools/classify_editorial_occurrences.py
          git diff --exit-code -- docs/EDITORIAL_OCCURRENCE_CLASSIFIER_2026-08-12.csv
          python tools/audit_editorial_lineage.py --input index.html --repository-root . --json editorial-lineage.json --markdown editorial-lineage.md
          git diff --check
      - name: Prepare content-only commit
        run: |
          git rm -f tools/apply_batch3_disposition.py tools/extract_batch3_context.py batch3-extraction.txt
      - name: Commit Batch 3 disposition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then echo 'workflow file unexpectedly staged' >&2; exit 1; fi
          git diff --cached --check
          git commit -m 'adjudicate Batch 3 R-01 R-03'
          git push origin HEAD:agent/disposition-batch-3
